<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby Log">
<title>Baby Log</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Baby Log","short_name":"BabyLog","start_url":".","display":"standalone","background_color":"%23f5f5f7","theme_color":"%232563eb","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>B</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>B</text></svg>'>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));background:#f5f5f7;color:#1c1c1e}
  h2{font-size:13px;text-transform:uppercase;color:#666;margin:18px 0 8px;letter-spacing:.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .timer-btn{padding:16px 8px;font-size:15px;font-weight:600;border:0;border-radius:12px;color:white;-webkit-tap-highlight-color:transparent;line-height:1.2}
  .timer-btn.full{grid-column:1/-1;padding:18px}
  .idle{background:#2563eb}.idle.green{background:#10b981}.idle.amber{background:#f59e0b}
  .active{background:#dc2626}
  .event-btn{padding:16px;font-size:16px;font-weight:600;border:0;border-radius:12px;color:white;background:#7c3aed;-webkit-tap-highlight-color:transparent}
  .event-btn.wee{background:#0891b2}
  .card{background:white;border-radius:14px;padding:12px;margin-top:8px}
  .row{padding:8px 0;border-bottom:1px solid #eee;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row:last-child{border:0}
  .row-info{flex:1;min-width:0}
  .act{font-weight:600}
  .t{color:#666;font-size:12px}
  .icon-btn{background:none;border:0;font-size:18px;padding:6px 8px;color:#666;-webkit-tap-highlight-color:transparent}
  .icon-btn.del{color:#dc2626}
  .ctrl{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ctrl button{flex:1;padding:12px;font-size:13px;background:#8e8e93;color:white;border:0;border-radius:10px;min-width:90px}
  .ctrl button.primary{background:#2563eb}
  svg.chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:4px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
  .nav button{background:#e5e7eb;border:0;border-radius:8px;width:36px;height:30px;font-size:16px}
  .nav button:disabled{opacity:0.3}
  #dateLabel{font-weight:600;font-size:13px;flex:1;text-align:center}
  .tabs{display:flex;background:#e5e7eb;border-radius:10px;padding:3px;margin-bottom:8px}
  .tabs button{flex:1;padding:8px;border:0;background:transparent;font-size:13px;font-weight:600;border-radius:7px;color:#666}
  .tabs button.on{background:white;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,0.08)}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-bg.on{display:flex}
  .modal{background:white;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 14px;font-size:17px}
  .modal label{display:block;font-size:12px;color:#666;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
  .modal select, .modal input{width:100%;padding:10px;font-size:16px;border:1px solid #d1d5db;border-radius:8px;background:white;font-family:inherit}
  .modal-actions{display:flex;gap:8px;margin-top:18px}
  .modal-actions button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:600}
  .modal-actions .cancel{background:#e5e7eb;color:#1c1c1e}
  .modal-actions .save{background:#2563eb;color:white}
  .modal-actions .del{background:#dc2626;color:white;flex:0 0 auto;padding:12px 14px}
  .hint{font-size:11px;color:#999;margin-top:6px}
</style>
</head>
<body>

<h2>Timed activities</h2>
<div id="timers" class="grid2"></div>

<h2>Events</h2>
<div id="events" class="grid2"></div>

<h2>Charts</h2>
<div class="card">
  <div class="tabs">
    <button id="tabDay" class="on" onclick="setView('day')">Day</button>
    <button id="tabWeek" onclick="setView('week')">Week</button>
    <button id="tabMonth" onclick="setView('month')">Month</button>
  </div>
  <div class="nav">
    <button onclick="shift(-1)">‹</button>
    <div id="dateLabel"></div>
    <button onclick="shift(1)" id="nextBtn">›</button>
  </div>
  <svg class="chart" id="chart" viewBox="0 0 700 200" preserveAspectRatio="none"></svg>
  <div class="legend" id="legend"></div>
  <div id="summary" class="t" style="margin-top:8px"></div>
</div>

<h2 id="logHeading">Log</h2>
<div class="card" id="log"></div>

<div class="ctrl">
  <button class="primary" onclick="openAddModal()">+ Add entry</button>
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="document.getElementById('importFile').click()">Import CSV</button>
  <input type="file" id="importFile" accept=".csv,text/csv" style="display:none" onchange="importCSV(event)">
</div>

<!-- Edit / Add modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Edit entry</h3>
    <label>Activity</label>
    <select id="mActivity"></select>
    <label>Type</label>
    <select id="mType">
      <option value="duration">Duration (start → end)</option>
      <option value="event">Event (single time)</option>
    </select>
    <label>Start</label>
    <input type="datetime-local" id="mStart">
    <div id="endWrap">
      <label>End</label>
      <input type="datetime-local" id="mEnd">
    </div>
    <div class="hint" id="durHint"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="del" id="mDelBtn" onclick="modalDelete()">🗑</button>
      <button class="save" onclick="modalSave()">Save</button>
    </div>
  </div>
</div>

<script>
const TIMED = [
  {id:"BreastL", label:"Breast L", color:"#2563eb", cls:"idle"},
  {id:"BreastR", label:"Breast R", color:"#10b981", cls:"idle green"},
  {id:"Nap",     label:"Nap",      color:"#f59e0b", cls:"idle amber", full:true}
];
const EVENTS = [
  {id:"Poo", label:"💩 Poo", color:"#7c3aed", cls:""},
  {id:"Wee", label:"💧 Wee", color:"#0891b2", cls:"wee"}
];
const COLOR = Object.fromEntries([...TIMED,...EVENTS].map(x=>[x.id,x.color]));
const ALL_ROWS = [...TIMED, ...EVENTS];
const VALID_IDS = new Set(ALL_ROWS.map(r=>r.id));

let starts = JSON.parse(localStorage.getItem("starts")||"{}");
let log    = JSON.parse(localStorage.getItem("log")||"[]");
let view   = "day";
let anchor = startOfDay(Date.now());
let editingIdx = null; // null = adding new

function startOfDay(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function startOfWeek(t){const d=new Date(startOfDay(t));const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return d.getTime();}
function startOfMonth(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime();}
function addDays(t,n){const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime();}
function addMonths(t,n){const d=new Date(t);d.setMonth(d.getMonth()+n);return d.getTime();}
function daysInMonth(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}

function save(){
  localStorage.setItem("starts",JSON.stringify(starts));
  localStorage.setItem("log",JSON.stringify(log));
}

function sortLog(){ log.sort((a,b)=> a.start - b.start); }

function setView(v){
  view = v;
  anchor = v==="day" ? startOfDay(Date.now()) : v==="week" ? startOfWeek(Date.now()) : startOfMonth(Date.now());
  document.getElementById("tabDay").classList.toggle("on", v==="day");
  document.getElementById("tabWeek").classList.toggle("on", v==="week");
  document.getElementById("tabMonth").classList.toggle("on", v==="month");
  render();
}

function shift(n){
  if(view==="day") anchor = startOfDay(addDays(anchor, n));
  else if(view==="week") anchor = startOfWeek(addDays(anchor, n*7));
  else anchor = startOfMonth(addMonths(anchor, n));
  render();
}

function toggleTimer(id){
  if(starts[id]){
    log.push({activity:id,start:starts[id],end:Date.now(),type:"duration"});
    delete starts[id];
    sortLog();
  } else {
    starts[id]=Date.now();
  }
  save(); render();
}

function logEvent(id){
  const now = Date.now();
  log.push({activity:id,start:now,end:now,type:"event"});
  sortLog();
  save(); render();
}

function fmtTime(t){return new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function fmtDate(t){return new Date(t).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"});}
function fmtDateShort(t){return new Date(t).toLocaleDateString([], {day:"numeric", month:"short"});}
function fmtMonth(t){return new Date(t).toLocaleDateString([], {month:"long", year:"numeric"});}
function dur(a,b){const s=Math.floor((b-a)/1000);const m=Math.floor(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m ${s%60}s`;}
function durShort(ms){const m=Math.floor(ms/60000);return m>=60?`${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`:`${m}m`;}

// ---- Modal (edit / add) ----
function tsToLocal(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function localToTs(s){ return new Date(s).getTime(); }

function populateActivities(){
  document.getElementById("mActivity").innerHTML = ALL_ROWS.map(r=>
    `<option value="${r.id}">${r.label}</option>`
  ).join("");
}

function openModal(){
  document.getElementById("modal").classList.add("on");
  syncTypeUI();
}

function closeModal(){
  document.getElementById("modal").classList.remove("on");
  editingIdx = null;
}

function syncTypeUI(){
  const type = document.getElementById("mType").value;
  document.getElementById("endWrap").style.display = type==="event" ? "none" : "block";
  updateDurHint();
}

function updateDurHint(){
  const type = document.getElementById("mType").value;
  if(type==="event"){ document.getElementById("durHint").textContent = ""; return; }
  const a = localToTs(document.getElementById("mStart").value);
  const b = localToTs(document.getElementById("mEnd").value);
  if(!isNaN(a) && !isNaN(b) && b>a) document.getElementById("durHint").textContent = `Duration: ${dur(a,b)}`;
  else document.getElementById("durHint").textContent = b<=a ? "End must be after start" : "";
}

function openEditModal(idx){
  const s = log[idx];
  if(!s) return;
  editingIdx = idx;
  populateActivities();
  document.getElementById("modalTitle").textContent = "Edit entry";
  document.getElementById("mActivity").value = s.activity;
  document.getElementById("mType").value = s.type;
  document.getElementById("mStart").value = tsToLocal(s.start);
  document.getElementById("mEnd").value = tsToLocal(s.end);
  document.getElementById("mDelBtn").style.display = "block";
  openModal();
}

function openAddModal(){
  editingIdx = null;
  populateActivities();
  document.getElementById("modalTitle").textContent = "Add entry";
  document.getElementById("mActivity").value = "BreastL";
  document.getElementById("mType").value = "duration";
  const now = Date.now();
  document.getElementById("mStart").value = tsToLocal(now - 10*60000);
  document.getElementById("mEnd").value = tsToLocal(now);
  document.getElementById("mDelBtn").style.display = "none";
  openModal();
}

function modalSave(){
  const activity = document.getElementById("mActivity").value;
  const type = document.getElementById("mType").value;
  const start = localToTs(document.getElementById("mStart").value);
  if(isNaN(start)){ alert("Invalid start time"); return; }
  let end = start;
  if(type==="duration"){
    end = localToTs(document.getElementById("mEnd").value);
    if(isNaN(end) || end<=start){ alert("End must be after start"); return; }
  }
  const entry = {activity, type, start, end};
  if(editingIdx===null) log.push(entry);
  else log[editingIdx] = entry;
  sortLog();
  save(); closeModal(); render();
}

function modalDelete(){
  if(editingIdx===null) return;
  if(!confirm("Delete this entry?")) return;
  log.splice(editingIdx,1);
  save(); closeModal(); render();
}

document.addEventListener("change", e=>{
  if(e.target.id==="mType") syncTypeUI();
  if(e.target.id==="mStart" || e.target.id==="mEnd") updateDurHint();
});
document.getElementById("modal").addEventListener("click", e=>{
  if(e.target.id==="modal") closeModal();
});

// ---- Render ----
function renderTimers(){
  document.getElementById("timers").innerHTML = TIMED.map(t=>{
    const on = starts[t.id];
    const cls = on ? "active" : t.cls;
    const main = on ? `Stop ${t.label}` : `Start ${t.label}`;
    const sub = on ? `<br><span style="font-weight:400;font-size:13px">${dur(on,Date.now())}</span>` : "";
    return `<button class="timer-btn ${cls}${t.full?' full':''}" onclick="toggleTimer('${t.id}')">${main}${sub}</button>`;
  }).join("");
}

function renderEvents(){
  document.getElementById("events").innerHTML = EVENTS.map(e=>
    `<button class="event-btn ${e.cls}" onclick="logEvent('${e.id}')">${e.label}</button>`
  ).join("");
}

function renderLegend(){
  document.getElementById("legend").innerHTML = ALL_ROWS.map(r=>
    `<span><i class="swatch" style="background:${r.color}"></i>${r.label.replace(/^[^\w]+/,'')}</span>`
  ).join("");
}

function windowRange(){
  if(view==="day") return [anchor, addDays(anchor,1)];
  if(view==="week") return [anchor, addDays(anchor,7)];
  return [anchor, addMonths(anchor,1)];
}

function isCurrentWindow(){
  const [s] = windowRange();
  if(view==="day") return s === startOfDay(Date.now());
  if(view==="week") return s === startOfWeek(Date.now());
  return s === startOfMonth(Date.now());
}

function entriesInWindow(){
  const [s,e] = windowRange();
  return log.map((x,i)=>({s:x,i})).filter(({s:x})=> x.end >= s && x.start < e);
}

function durationOnDay(entry, dayStart){
  const dayEnd = addDays(dayStart, 1);
  const a = Math.max(entry.start, dayStart);
  const b = Math.min(entry.end, dayEnd);
  return Math.max(0, b-a);
}

function renderChart(){
  const svg = document.getElementById("chart");
  if(view==="day") return renderDayChart(svg);
  if(view==="week") return renderRangeChart(svg, 7);
  renderRangeChart(svg, daysInMonth(anchor));
}

function renderDayChart(svg){
  const W=700, padL=40, padR=10, padT=10, padB=30;
  const innerW = W-padL-padR;
  const rowH = 28;
  const rows = ALL_ROWS;
  const totalH = padT + rows.length*rowH + padB;
  svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);

  const dayStart = anchor;
  const dayEnd = addDays(dayStart,1);
  const xOf = t => padL + ((Math.max(dayStart,Math.min(dayEnd,t)) - dayStart)/(24*3600*1000))*innerW;

  let html = "";
  for(let h=0; h<=24; h+=3){
    const x = padL + (h/24)*innerW;
    html += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${totalH-padB}" stroke="#e5e7eb"/>`;
    html += `<text x="${x}" y="${totalH-padB+14}" font-size="10" text-anchor="middle" fill="#666">${String(h).padStart(2,'0')}</text>`;
  }
  rows.forEach((r,i)=>{
    const y = padT + i*rowH + rowH/2;
    html += `<text x="${padL-4}" y="${y+3}" font-size="10" text-anchor="end" fill="#666">${r.label}</text>`;
  });
  log.forEach(s=>{
    if(s.end < dayStart || s.start > dayEnd) return;
    const rowIdx = rows.findIndex(r=>r.id===s.activity);
    if(rowIdx<0) return;
    const y = padT + rowIdx*rowH + 4;
    const h = rowH - 8;
    const x1 = xOf(s.start), x2 = xOf(s.end);
    if(s.type==="event"){
      html += `<circle cx="${x1}" cy="${y+h/2}" r="5" fill="${COLOR[s.activity]}"/>`;
    } else {
      html += `<rect x="${x1}" y="${y}" width="${Math.max(2,x2-x1)}" height="${h}" rx="3" fill="${COLOR[s.activity]}"/>`;
    }
  });
  if(isCurrentWindow()){
    Object.entries(starts).forEach(([id,t])=>{
      const rowIdx = rows.findIndex(r=>r.id===id);
      if(rowIdx<0) return;
      const y = padT + rowIdx*rowH + 4;
      const h = rowH - 8;
      const x1 = xOf(t), x2 = xOf(Date.now());
      html += `<rect x="${x1}" y="${y}" width="${Math.max(2,x2-x1)}" height="${h}" rx="3" fill="${COLOR[id]}" opacity="0.5"/>`;
    });
    const nowX = xOf(Date.now());
    html += `<line x1="${nowX}" y1="${padT}" x2="${nowX}" y2="${totalH-padB}" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>`;
  }
  svg.innerHTML = html;
}

function renderRangeChart(svg, nDays){
  const W=700, padL=40, padR=10, padT=10, padB=40;
  const innerW = W-padL-padR;
  const barArea = 140;
  const eventArea = 50;
  const totalH = padT + barArea + eventArea + padB;
  svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);

  const days = [];
  for(let i=0;i<nDays;i++){
    const dStart = addDays(anchor, i);
    const bucket = {date:dStart, BreastL:0, BreastR:0, Nap:0, Poo:0, Wee:0};
    log.forEach(s=>{
      if(s.type==="duration"){
        bucket[s.activity] = (bucket[s.activity]||0) + durationOnDay(s, dStart);
      } else {
        if(s.start >= dStart && s.start < addDays(dStart,1)){
          bucket[s.activity] = (bucket[s.activity]||0) + 1;
        }
      }
    });
    days.push(bucket);
  }

  const maxDur = Math.max(1, ...days.map(d=> d.BreastL + d.BreastR + d.Nap));
  const maxHours = Math.max(1, Math.ceil(maxDur/3600000));
  const yOf = ms => padT + barArea - (ms/(maxHours*3600000))*barArea;

  const barW = innerW/nDays;
  const innerBarW = Math.max(4, barW*0.7);
  const barOffset = (barW - innerBarW)/2;

  let html = "";
  const step = maxHours <= 4 ? 1 : maxHours <= 12 ? 2 : 4;
  for(let h=0; h<=maxHours; h+=step){
    const y = yOf(h*3600000);
    html += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e5e7eb"/>`;
    html += `<text x="${padL-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#666">${h}h</text>`;
  }

  days.forEach((d,i)=>{
    const x = padL + i*barW + barOffset;
    let yCursor = padT + barArea;
    [["BreastL",COLOR.BreastL],["BreastR",COLOR.BreastR],["Nap",COLOR.Nap]].forEach(([k,c])=>{
      const h = (d[k]/(maxHours*3600000))*barArea;
      if(h>0){
        yCursor -= h;
        html += `<rect x="${x}" y="${yCursor}" width="${innerBarW}" height="${h}" fill="${c}"/>`;
      }
    });
    const xc = padL + i*barW + barW/2;
    const lbl = view==="week"
      ? new Date(d.date).toLocaleDateString([], {weekday:"short"})
      : String(new Date(d.date).getDate());
    if(view==="week" || i%Math.ceil(nDays/15)===0){
      html += `<text x="${xc}" y="${padT+barArea+12}" font-size="9" text-anchor="middle" fill="#666">${lbl}</text>`;
    }
    const evY = padT + barArea + 20;
    if(d.Poo) html += `<circle cx="${xc-5}" cy="${evY}" r="3.5" fill="${COLOR.Poo}"/><text x="${xc-5}" y="${evY+12}" font-size="8" text-anchor="middle" fill="#666">${d.Poo}</text>`;
    if(d.Wee) html += `<circle cx="${xc+5}" cy="${evY}" r="3.5" fill="${COLOR.Wee}"/><text x="${xc+5}" y="${evY+12}" font-size="8" text-anchor="middle" fill="#666">${d.Wee}</text>`;
  });

  html += `<text x="${padL}" y="${totalH-4}" font-size="9" fill="#666">Bars: hours of feed (L+R) & nap · Dots: poo/wee counts</text>`;
  svg.innerHTML = html;
}

function renderLog(){
  let heading;
  if(view==="day") heading = isCurrentWindow() ? "Today's log" : `Log — ${fmtDate(anchor)}`;
  else if(view==="week"){ const [s,e]=windowRange(); heading = `Log — ${fmtDateShort(s)} to ${fmtDateShort(e-1)}`; }
  else heading = `Log — ${fmtMonth(anchor)}`;
  document.getElementById("logHeading").textContent = heading;

  const rows = entriesInWindow().reverse();
  document.getElementById("log").innerHTML = rows.length ? rows.map(({s,i})=>{
    const showDate = view !== "day";
    const when = s.type==="event"
      ? (showDate? `${fmtDateShort(s.start)} ${fmtTime(s.start)}` : fmtTime(s.start))
      : (showDate? `${fmtDateShort(s.start)} ${fmtTime(s.start)} → ${fmtTime(s.end)} (${dur(s.start,s.end)})` : `${fmtTime(s.start)} → ${fmtTime(s.end)} (${dur(s.start,s.end)})`);
    return `<div class="row">
      <div class="row-info"><div class="act" style="color:${COLOR[s.activity]}">${s.activity}</div><div class="t">${when}</div></div>
      <button class="icon-btn" onclick="openEditModal(${i})" aria-label="Edit">✎</button>
    </div>`;
  }).join("") : '<div class="t">No entries</div>';
}

function renderNav(){
  let label;
  if(view==="day") label = isCurrentWindow() ? `Today · ${fmtDate(anchor)}` : fmtDate(anchor);
  else if(view==="week"){ const [s,e]=windowRange(); label = `${fmtDateShort(s)} – ${fmtDateShort(e-1)}`; }
  else label = fmtMonth(anchor);
  document.getElementById("dateLabel").textContent = label;
  document.getElementById("nextBtn").disabled = isCurrentWindow();
}

function renderSummary(){
  const entries = entriesInWindow().map(x=>x.s);
  const totals = {};
  const [winS, winE] = windowRange();
  entries.forEach(s=>{
    if(s.type==="duration"){
      const a = Math.max(s.start, winS), b = Math.min(s.end, winE);
      totals[s.activity] = (totals[s.activity]||0) + Math.max(0,b-a);
    } else {
      totals[s.activity] = (totals[s.activity]||0) + 1;
    }
  });
  const parts = [];
  TIMED.forEach(t=>{ if(totals[t.id]) parts.push(`${t.label}: ${durShort(totals[t.id])}`); });
  EVENTS.forEach(e=>{ if(totals[e.id]) parts.push(`${e.label.replace(/[^\w ]/g,'').trim()}: ${totals[e.id]}`); });

  if(view !== "day" && parts.length){
    const days = view==="week" ? 7 : daysInMonth(anchor);
    const elapsedDays = isCurrentWindow()
      ? Math.min(days, Math.ceil((Date.now()-winS)/(24*3600*1000)))
      : days;
    const avgParts = [];
    TIMED.forEach(t=>{ if(totals[t.id]) avgParts.push(`${t.label.split(' ').pop()[0]}:${durShort(totals[t.id]/elapsedDays)}`); });
    EVENTS.forEach(e=>{ if(totals[e.id]) avgParts.push(`${e.label.replace(/[^\w ]/g,'').trim()[0]}:${(totals[e.id]/elapsedDays).toFixed(1)}`); });
    document.getElementById("summary").innerHTML = parts.join(" · ") + `<br><span style="color:#999">Avg/day: ${avgParts.join(' · ')}</span>`;
    return;
  }
  document.getElementById("summary").textContent = parts.join(" · ") || "No activity";
}

function render(){ renderTimers(); renderEvents(); renderLegend(); renderNav(); renderChart(); renderSummary(); renderLog(); }

// ---- Export / Import CSV ----
function exportCSV(){
  const csv = "activity,type,start_iso,end_iso,duration_sec\n" + log.map(s=>
    `${s.activity},${s.type},${new Date(s.start).toISOString()},${new Date(s.end).toISOString()},${Math.floor((s.end-s.start)/1000)}`
  ).join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `babylog_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

function importCSV(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length < 2) throw new Error("Empty file");
      const header = lines[0].toLowerCase().split(",").map(s=>s.trim());
      const iAct = header.indexOf("activity");
      const iType = header.indexOf("type");
      const iStart = header.indexOf("start_iso");
      const iEnd = header.indexOf("end_iso");
      if([iAct,iType,iStart,iEnd].some(x=>x<0)) throw new Error("Missing required columns");

      const imported = [];
      for(let i=1; i<lines.length; i++){
        const cols = lines[i].split(",").map(s=>s.trim());
        const activity = cols[iAct];
        const type = cols[iType];
        const start = new Date(cols[iStart]).getTime();
        const end = new Date(cols[iEnd]).getTime();
        if(!VALID_IDS.has(activity)) continue;
        if(type!=="duration" && type!=="event") continue;
        if(isNaN(start) || isNaN(end)) continue;
        imported.push({activity, type, start, end});
      }
      if(!imported.length) throw new Error("No valid rows found");

      const choice = confirm(`Import ${imported.length} entries.\n\nOK = MERGE with existing (skips duplicates)\nCancel = REPLACE all existing data`);
      if(choice){
        const existing = new Set(log.map(s=>`${s.activity}|${s.start}|${s.end}`));
        let added = 0;
        imported.forEach(s=>{
          const k = `${s.activity}|${s.start}|${s.end}`;
          if(!existing.has(k)){ log.push(s); existing.add(k); added++; }
        });
        alert(`Merged: ${added} new entries added.`);
      } else {
        if(!confirm("Really REPLACE all current data?")) return;
        log = imported;
        alert(`Replaced: ${imported.length} entries loaded.`);
      }
      sortLog(); save(); render();
    } catch(err){
      alert("Import failed: " + err.message);
    }
    ev.target.value = "";
  };
  reader.readAsText(file);
}

render();
setInterval(()=>{ if(Object.keys(starts).length){ renderTimers(); if(view==="day") renderChart(); } }, 1000);
</script>
