<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby Log">
<title>Baby Log</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Baby Log","short_name":"BabyLog","start_url":".","display":"standalone","background_color":"%23f5f5f7","theme_color":"%232563eb","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>B</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>B</text></svg>'>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));background:#f5f5f7;color:#1c1c1e}
  h2{font-size:14px;text-transform:uppercase;color:#666;margin:20px 0 8px;letter-spacing:.5px}
  .timer-btn{width:100%;padding:22px;font-size:19px;font-weight:600;border:0;border-radius:14px;margin-bottom:10px;color:white;-webkit-tap-highlight-color:transparent}
  .idle{background:#2563eb}.active{background:#dc2626}
  .events{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .event-btn{padding:18px;font-size:17px;font-weight:600;border:0;border-radius:14px;color:white;background:#7c3aed;-webkit-tap-highlight-color:transparent}
  .event-btn.wee{background:#0891b2}
  .card{background:white;border-radius:14px;padding:14px;margin-top:10px}
  .row{padding:8px 0;border-bottom:1px solid #eee;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .row:last-child{border:0}
  .act{font-weight:600}
  .t{color:#666;font-size:12px}
  .del{background:none;border:0;color:#dc2626;font-size:18px;padding:4px 8px}
  .ctrl{display:flex;gap:8px;margin-top:14px}
  .ctrl button{flex:1;padding:12px;font-size:14px;background:#8e8e93;color:white;border:0;border-radius:10px}
  svg.timeline{width:100%;height:auto;display:block}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:4px}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>

<h2>Timed activities</h2>
<div id="timers"></div>

<h2>Events</h2>
<div class="events" id="events"></div>

<h2>Today's timeline</h2>
<div class="card">
  <svg class="timeline" id="chart" viewBox="0 0 700 200" preserveAspectRatio="none"></svg>
  <div class="legend">
    <span><i class="swatch" style="background:#2563eb"></i>Breast L</span>
    <span><i class="swatch" style="background:#10b981"></i>Breast R</span>
    <span><i class="swatch" style="background:#f59e0b"></i>Nap</span>
    <span><i class="swatch" style="background:#7c3aed"></i>Poo</span>
    <span><i class="swatch" style="background:#0891b2"></i>Wee</span>
  </div>
</div>

<h2>Recent log</h2>
<div class="card" id="log"></div>

<div class="ctrl">
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="if(confirm('Clear ALL data?')){localStorage.clear();starts={};log=[];render();}">Clear all</button>
</div>

<script>
const TIMED = [
  {id:"BreastL", label:"Breast L", color:"#2563eb"},
  {id:"BreastR", label:"Breast R", color:"#10b981"},
  {id:"Nap",     label:"Nap",      color:"#f59e0b"}
];
const EVENTS = [
  {id:"Poo", label:"💩 Poo", color:"#7c3aed", cls:""},
  {id:"Wee", label:"💧 Wee", color:"#0891b2", cls:"wee"}
];
const COLOR = Object.fromEntries([...TIMED,...EVENTS].map(x=>[x.id,x.color]));

let starts = JSON.parse(localStorage.getItem("starts")||"{}");
let log    = JSON.parse(localStorage.getItem("log")||"[]");

function save(){
  localStorage.setItem("starts",JSON.stringify(starts));
  localStorage.setItem("log",JSON.stringify(log));
}

function toggleTimer(id){
  if(starts[id]){
    log.push({activity:id,start:starts[id],end:Date.now(),type:"duration"});
    delete starts[id];
  } else {
    starts[id]=Date.now();
  }
  save(); render();
}

function logEvent(id){
  const now = Date.now();
  log.push({activity:id,start:now,end:now,type:"event"});
  save(); render();
}

function deleteRow(i){
  if(confirm("Delete this entry?")){ log.splice(i,1); save(); render(); }
}

function fmtTime(t){return new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function fmtDate(t){return new Date(t).toLocaleDateString();}
function dur(a,b){const s=Math.floor((b-a)/1000);const m=Math.floor(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m ${s%60}s`;}

function renderTimers(){
  document.getElementById("timers").innerHTML = TIMED.map(t=>{
    const on = starts[t.id];
    const label = on ? `Stop ${t.label} · ${dur(on,Date.now())}` : `Start ${t.label}`;
    return `<button class="timer-btn ${on?'active':'idle'}" onclick="toggleTimer('${t.id}')">${label}</button>`;
  }).join("");
}

function renderEvents(){
  document.getElementById("events").innerHTML = EVENTS.map(e=>
    `<button class="event-btn ${e.cls}" onclick="logEvent('${e.id}')">${e.label}</button>`
  ).join("");
}

function renderLog(){
  const recent = log.slice(-30).reverse();
  document.getElementById("log").innerHTML = recent.length ? recent.map((s,i)=>{
    const realIdx = log.length - 1 - i;
    const label = s.type==="event"
      ? `${fmtDate(s.start)} ${fmtTime(s.start)}`
      : `${fmtTime(s.start)} → ${fmtTime(s.end)} (${dur(s.start,s.end)})`;
    return `<div class="row">
      <div><div class="act" style="color:${COLOR[s.activity]}">${s.activity}</div><div class="t">${label}</div></div>
      <button class="del" onclick="deleteRow(${realIdx})">✕</button>
    </div>`;
  }).join("") : '<div class="t">No entries yet</div>';
}

function renderChart(){
  const svg = document.getElementById("chart");
  const W=700, H=200, padL=30, padR=10, padT=10, padB=30;
  const innerW = W-padL-padR;
  const rowH = 28;
  const rows = [...TIMED, ...EVENTS];
  const totalH = padT + rows.length*rowH + padB;
  svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);

  // Today window: midnight → midnight
  const now = new Date();
  const dayStart = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const dayEnd = dayStart + 24*3600*1000;
  const xOf = t => padL + ((Math.max(dayStart,Math.min(dayEnd,t)) - dayStart)/(24*3600*1000))*innerW;

  let html = "";
  // hour gridlines
  for(let h=0; h<=24; h+=3){
    const x = padL + (h/24)*innerW;
    html += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${totalH-padB}" stroke="#e5e7eb"/>`;
    html += `<text x="${x}" y="${totalH-padB+14}" font-size="10" text-anchor="middle" fill="#666">${String(h).padStart(2,'0')}:00</text>`;
  }
  // row labels
  rows.forEach((r,i)=>{
    const y = padT + i*rowH + rowH/2;
    html += `<text x="${padL-4}" y="${y+3}" font-size="10" text-anchor="end" fill="#666">${r.label}</text>`;
  });
  // entries
  log.forEach(s=>{
    if(s.end < dayStart || s.start > dayEnd) return;
    const rowIdx = rows.findIndex(r=>r.id===s.activity);
    if(rowIdx<0) return;
    const y = padT + rowIdx*rowH + 4;
    const h = rowH - 8;
    const x1 = xOf(s.start), x2 = xOf(s.end);
    if(s.type==="event"){
      html += `<circle cx="${x1}" cy="${y+h/2}" r="5" fill="${COLOR[s.activity]}"/>`;
    } else {
      html += `<rect x="${x1}" y="${y}" width="${Math.max(2,x2-x1)}" height="${h}" rx="3" fill="${COLOR[s.activity]}"/>`;
    }
  });
  // in-progress timers (show up to now)
  Object.entries(starts).forEach(([id,t])=>{
    const rowIdx = rows.findIndex(r=>r.id===id);
    if(rowIdx<0) return;
    const y = padT + rowIdx*rowH + 4;
    const h = rowH - 8;
    const x1 = xOf(t), x2 = xOf(Date.now());
    html += `<rect x="${x1}" y="${y}" width="${Math.max(2,x2-x1)}" height="${h}" rx="3" fill="${COLOR[id]}" opacity="0.5"/>`;
  });
  // "now" marker
  const nowX = xOf(Date.now());
  html += `<line x1="${nowX}" y1="${padT}" x2="${nowX}" y2="${totalH-padB}" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>`;
  svg.innerHTML = html;
}

function render(){ renderTimers(); renderEvents(); renderLog(); renderChart(); }

function exportCSV(){
  const csv = "activity,type,start_iso,end_iso,duration_sec\n" + log.map(s=>
    `${s.activity},${s.type},${new Date(s.start).toISOString()},${new Date(s.end).toISOString()},${Math.floor((s.end-s.start)/1000)}`
  ).join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `babylog_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

render();
// Live-update for running timers
setInterval(()=>{ if(Object.keys(starts).length){ renderTimers(); renderChart(); } }, 1000);
</script>
</body>
</html>
