<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby Log">
<title>Baby Log</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Baby Log","short_name":"BabyLog","start_url":".","display":"standalone","background_color":"%23f5f5f7","theme_color":"%232563eb","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>B</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>B</text></svg>'>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));background:#f5f5f7;color:#1c1c1e}
  h2{font-size:13px;text-transform:uppercase;color:#666;margin:18px 0 8px;letter-spacing:.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .timer-btn{padding:16px 8px;font-size:15px;font-weight:600;border:0;border-radius:12px;color:white;-webkit-tap-highlight-color:transparent;line-height:1.2}
  .timer-btn.full{grid-column:1/-1;padding:18px}
  .idle{background:#2563eb}.idle.green{background:#10b981}.idle.amber{background:#f59e0b}
  .active{background:#dc2626}
  .event-btn{padding:14px 8px;font-size:15px;font-weight:600;border:0;border-radius:12px;color:white;-webkit-tap-highlight-color:transparent;line-height:1.2}
  .event-btn.poo{background:#7c3aed}
  .event-btn.wee{background:#0891b2}
  .event-btn.ebm{background:#06b6d4}
  .event-btn.formula{background:#ec4899}
  .card{background:white;border-radius:14px;padding:12px;margin-top:8px}
  .row{padding:8px 0;border-bottom:1px solid #eee;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row:last-child{border:0}
  .row-info{flex:1;min-width:0}
  .act{font-weight:600}
  .t{color:#666;font-size:12px}
  .icon-btn{background:none;border:0;font-size:18px;padding:6px 8px;color:#666;-webkit-tap-highlight-color:transparent}
  .icon-btn.del{color:#dc2626}
  .ctrl{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ctrl button{flex:1;padding:12px;font-size:13px;background:#8e8e93;color:white;border:0;border-radius:10px;min-width:90px}
  .ctrl button.primary{background:#2563eb}
  svg.chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:4px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
  .nav button{background:#e5e7eb;border:0;border-radius:8px;width:36px;height:30px;font-size:16px}
  .nav button:disabled{opacity:0.3}
  #dateLabel{font-weight:600;font-size:13px;flex:1;text-align:center}
  .tabs{display:flex;background:#e5e7eb;border-radius:10px;padding:3px;margin-bottom:8px}
  .tabs button{flex:1;padding:8px;border:0;background:transparent;font-size:13px;font-weight:600;border-radius:7px;color:#666}
  .tabs button.on{background:white;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,0.08)}
  .toptabs{display:flex;background:#1c1c1e;border-radius:12px;padding:4px;margin-bottom:14px}
  .toptabs button{flex:1;padding:10px;border:0;background:transparent;font-size:14px;font-weight:600;border-radius:8px;color:#999}
  .toptabs button.on{background:#2563eb;color:white}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-bg.on{display:flex}
  .modal{background:white;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 14px;font-size:17px}
  .modal label{display:block;font-size:12px;color:#666;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
  .modal select, .modal input{width:100%;padding:10px;font-size:16px;border:1px solid #d1d5db;border-radius:8px;background:white;font-family:inherit}
  .modal-actions{display:flex;gap:8px;margin-top:18px}
  .modal-actions button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:600}
  .modal-actions .cancel{background:#e5e7eb;color:#1c1c1e}
  .modal-actions .save{background:#2563eb;color:white}
  .modal-actions .del{background:#dc2626;color:white;flex:0 0 auto;padding:12px 14px}
  .hint{font-size:11px;color:#999;margin-top:6px}
  .stat-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
  .stat-row .v{font-weight:600}
  section.hidden{display:none}
</style>
</head>
<body>

<div class="toptabs">
  <button id="topActivity" class="on" onclick="setTopTab('activity')">Activity</button>
  <button id="topWeight" onclick="setTopTab('weight')">Weight</button>
</div>

<section id="secActivity">
  <h2>Timed activities</h2>
  <div id="timers" class="grid2"></div>

  <h2>Events</h2>
  <div id="events" class="grid2"></div>

  <h2>Charts</h2>
  <div class="card">
    <div class="tabs">
      <button id="tabDay" class="on" onclick="setView('day')">Day</button>
      <button id="tabWeek" onclick="setView('week')">Week</button>
      <button id="tabMonth" onclick="setView('month')">Month</button>
    </div>
    <div class="nav">
      <button onclick="shift(-1)">‹</button>
      <div id="dateLabel"></div>
      <button onclick="shift(1)" id="nextBtn">›</button>
    </div>
    <svg class="chart" id="chart" viewBox="0 0 700 200" preserveAspectRatio="none"></svg>
    <div class="legend" id="legend"></div>
    <div id="summary" class="t" style="margin-top:8px"></div>
  </div>

  <h2 id="logHeading">Log</h2>
  <div class="card" id="log"></div>

  <div class="ctrl">
    <button class="primary" onclick="openAddModal()">+ Add entry</button>
  </div>
</section>

<section id="secWeight" class="hidden">
  <h2>Weight chart</h2>
  <div class="card">
    <svg class="chart" id="wChart" viewBox="0 0 700 240" preserveAspectRatio="none"></svg>
    <div id="wStats" style="margin-top:10px"></div>
  </div>

  <h2>Weight log</h2>
  <div class="card" id="wLog"></div>

  <div class="ctrl">
    <button class="primary" onclick="openWeightModal()">+ Add weight</button>
  </div>
</section>

<div class="ctrl">
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="document.getElementById('importFile').click()">Import CSV</button>
  <input type="file" id="importFile" accept=".csv,text/csv" style="display:none" onchange="importCSV(event)">
</div>

<!-- Activity edit/add modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Edit entry</h3>
    <label>Activity</label>
    <select id="mActivity"></select>
    <label>Type</label>
    <select id="mType">
      <option value="duration">Duration (start → end)</option>
      <option value="event">Event (single time)</option>
      <option value="bottle">Bottle (time + mL)</option>
    </select>
    <label>Start</label>
    <input type="datetime-local" id="mStart">
    <div id="endWrap">
      <label>End</label>
      <input type="datetime-local" id="mEnd">
    </div>
    <div id="mlWrap">
      <label>Volume (mL)</label>
      <input type="number" id="mMl" step="1" min="0" inputmode="numeric" placeholder="e.g. 120">
    </div>
    <div class="hint" id="durHint"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="del" id="mDelBtn" onclick="modalDelete()">🗑</button>
      <button class="save" onclick="modalSave()">Save</button>
    </div>
  </div>
</div>

<!-- Bottle quick-log modal -->
<div class="modal-bg" id="bModal">
  <div class="modal">
    <h3 id="bTitle">Log bottle</h3>
    <label>Time</label>
    <input type="datetime-local" id="bWhen">
    <label>Volume (mL)</label>
    <input type="number" id="bMl" step="1" min="0" inputmode="numeric" placeholder="e.g. 120">
    <div class="modal-actions">
      <button class="cancel" onclick="closeBottleModal()">Cancel</button>
      <button class="save" onclick="bottleSave()">Save</button>
    </div>
  </div>
</div>

<!-- Weight edit/add modal -->
<div class="modal-bg" id="wModal">
  <div class="modal">
    <h3 id="wModalTitle">Add weight</h3>
    <label>Date &amp; time</label>
    <input type="datetime-local" id="wWhen">
    <label>Weight (kg)</label>
    <input type="number" id="wKg" step="0.01" min="0" inputmode="decimal" placeholder="e.g. 4.25">
    <div class="hint" id="wHint"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeWeightModal()">Cancel</button>
      <button class="del" id="wDelBtn" onclick="weightDelete()">🗑</button>
      <button class="save" onclick="weightSave()">Save</button>
    </div>
  </div>
</div>

<script>
const TIMED = [
  {id:"BreastL", label:"Breast L", color:"#2563eb", cls:"idle"},
  {id:"BreastR", label:"Breast R", color:"#10b981", cls:"idle green"},
  {id:"Nap",     label:"Nap",      color:"#f59e0b", cls:"idle amber", full:true}
];
const EVENTS = [
  {id:"Poo",           label:"💩 Poo",     color:"#7c3aed", cls:"poo",     mode:"event"},
  {id:"Wee",           label:"💧 Wee",     color:"#0891b2", cls:"wee",     mode:"event"},
  {id:"BottleEBM",     label:"🍼 EBM",     color:"#06b6d4", cls:"ebm",     mode:"bottle"},
  {id:"BottleFormula", label:"🍼 Formula", color:"#ec4899", cls:"formula", mode:"bottle"}
];
const COLOR = Object.fromEntries([...TIMED,...EVENTS].map(x=>[x.id,x.color]));
const ALL_ROWS = [...TIMED, ...EVENTS];
const VALID_IDS = new Set(ALL_ROWS.map(r=>r.id));
const BOTTLE_IDS = new Set(EVENTS.filter(e=>e.mode==="bottle").map(e=>e.id));

let starts  = JSON.parse(localStorage.getItem("starts")||"{}");
let log     = JSON.parse(localStorage.getItem("log")||"[]");
let weights = JSON.parse(localStorage.getItem("weights")||"[]");
let view    = "day";
let anchor  = startOfDay(Date.now());
let editingIdx = null;
let editingWeightIdx = null;
let bottlePending = null; // {id, label}
let topTab  = "activity";

function startOfDay(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function startOfWeek(t){const d=new Date(startOfDay(t));const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return d.getTime();}
function startOfMonth(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime();}
function addDays(t,n){const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime();}
function addMonths(t,n){const d=new Date(t);d.setMonth(d.getMonth()+n);return d.getTime();}
function daysInMonth(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}

function save(){
  localStorage.setItem("starts",JSON.stringify(starts));
  localStorage.setItem("log",JSON.stringify(log));
  localStorage.setItem("weights",JSON.stringify(weights));
}
function sortLog(){ log.sort((a,b)=> a.start - b.start); }
function sortWeights(){ weights.sort((a,b)=> a.t - b.t); }

function setTopTab(t){
  topTab = t;
  document.getElementById("topActivity").classList.toggle("on", t==="activity");
  document.getElementById("topWeight").classList.toggle("on", t==="weight");
  document.getElementById("secActivity").classList.toggle("hidden", t!=="activity");
  document.getElementById("secWeight").classList.toggle("hidden", t!=="weight");
  if(t==="weight") renderWeight();
}

function setView(v){
  view = v;
  anchor = v==="day" ? startOfDay(Date.now()) : v==="week" ? startOfWeek(Date.now()) : startOfMonth(Date.now());
  document.getElementById("tabDay").classList.toggle("on", v==="day");
  document.getElementById("tabWeek").classList.toggle("on", v==="week");
  document.getElementById("tabMonth").classList.toggle("on", v==="month");
  render();
}

function shift(n){
  if(view==="day") anchor = startOfDay(addDays(anchor, n));
  else if(view==="week") anchor = startOfWeek(addDays(anchor, n*7));
  else anchor = startOfMonth(addMonths(anchor, n));
  render();
}

function toggleTimer(id){
  if(starts[id]){
    log.push({activity:id,start:starts[id],end:Date.now(),type:"duration"});
    delete starts[id]; sortLog();
  } else { starts[id]=Date.now(); }
  save(); render();
}

function handleEventTap(ev){
  if(ev.mode === "event"){
    const now = Date.now();
    log.push({activity:ev.id,start:now,end:now,type:"event"});
    sortLog(); save(); render();
  } else if(ev.mode === "bottle"){
    openBottleModal(ev);
  }
}

function fmtTime(t){return new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function fmtDate(t){return new Date(t).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"});}
function fmtDateShort(t){return new Date(t).toLocaleDateString([], {day:"numeric", month:"short"});}
function fmtMonth(t){return new Date(t).toLocaleDateString([], {month:"long", year:"numeric"});}
function dur(a,b){const s=Math.floor((b-a)/1000);const m=Math.floor(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m ${s%60}s`;}
function durShort(ms){const m=Math.floor(ms/60000);return m>=60?`${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`:`${m}m`;}

// ---- Activity edit/add modal ----
function tsToLocal(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function localToTs(s){return new Date(s).getTime();}
function populateActivities(){document.getElementById("mActivity").innerHTML = ALL_ROWS.map(r=>`<option value="${r.id}">${r.label}</option>`).join("");}
function openModal(){document.getElementById("modal").classList.add("on");syncTypeUI();}
function closeModal(){document.getElementById("modal").classList.remove("on");editingIdx=null;}
function syncTypeUI(){
  const type=document.getElementById("mType").value;
  document.getElementById("endWrap").style.display = type==="duration" ? "block" : "none";
  document.getElementById("mlWrap").style.display  = type==="bottle"   ? "block" : "none";
  updateDurHint();
}
function updateDurHint(){
  const type=document.getElementById("mType").value;
  if(type!=="duration"){document.getElementById("durHint").textContent="";return;}
  const a=localToTs(document.getElementById("mStart").value);
  const b=localToTs(document.getElementById("mEnd").value);
  if(!isNaN(a)&&!isNaN(b)&&b>a)document.getElementById("durHint").textContent=`Duration: ${dur(a,b)}`;
  else document.getElementById("durHint").textContent=b<=a?"End must be after start":"";
}
function openEditModal(idx){
  const s=log[idx];if(!s)return;
  editingIdx=idx;
  populateActivities();
  document.getElementById("modalTitle").textContent="Edit entry";
  document.getElementById("mActivity").value=s.activity;
  document.getElementById("mType").value=s.type;
  document.getElementById("mStart").value=tsToLocal(s.start);
  document.getElementById("mEnd").value=tsToLocal(s.end);
  document.getElementById("mMl").value = s.ml ?? "";
  document.getElementById("mDelBtn").style.display="block";
  openModal();
}
function openAddModal(){
  editingIdx=null;
  populateActivities();
  document.getElementById("modalTitle").textContent="Add entry";
  document.getElementById("mActivity").value="BreastL";
  document.getElementById("mType").value="duration";
  const now=Date.now();
  document.getElementById("mStart").value=tsToLocal(now-10*60000);
  document.getElementById("mEnd").value=tsToLocal(now);
  document.getElementById("mMl").value="";
  document.getElementById("mDelBtn").style.display="none";
  openModal();
}
function modalSave(){
  const activity=document.getElementById("mActivity").value;
  const type=document.getElementById("mType").value;
  const start=localToTs(document.getElementById("mStart").value);
  if(isNaN(start)){alert("Invalid start time");return;}
  let end=start;
  let ml;
  if(type==="duration"){
    end=localToTs(document.getElementById("mEnd").value);
    if(isNaN(end)||end<=start){alert("End must be after start");return;}
  }
  if(type==="bottle"){
    ml = parseFloat(document.getElementById("mMl").value);
    if(isNaN(ml) || ml<=0){ alert("Enter volume in mL"); return; }
    if(!BOTTLE_IDS.has(activity)){ alert("Bottle type must be EBM or Formula"); return; }
  }
  const entry={activity,type,start,end};
  if(type==="bottle") entry.ml = ml;
  if(editingIdx===null) log.push(entry); else log[editingIdx]=entry;
  sortLog(); save(); closeModal(); render();
}
function modalDelete(){if(editingIdx===null)return;if(!confirm("Delete this entry?"))return;log.splice(editingIdx,1);save();closeModal();render();}

// ---- Bottle quick modal ----
function openBottleModal(ev){
  bottlePending = ev;
  document.getElementById("bTitle").textContent = `Log ${ev.label.replace(/^[^\w]+/,'').trim()}`;
  document.getElementById("bWhen").value = tsToLocal(Date.now());
  document.getElementById("bMl").value = "";
  document.getElementById("bModal").classList.add("on");
  setTimeout(()=>document.getElementById("bMl").focus(), 100);
}
function closeBottleModal(){document.getElementById("bModal").classList.remove("on");bottlePending=null;}
function bottleSave(){
  if(!bottlePending) return;
  const t = localToTs(document.getElementById("bWhen").value);
  const ml = parseFloat(document.getElementById("bMl").value);
  if(isNaN(t)){ alert("Invalid time"); return; }
  if(isNaN(ml) || ml<=0){ alert("Enter volume in mL"); return; }
  log.push({activity:bottlePending.id, type:"bottle", start:t, end:t, ml});
  sortLog(); save(); closeBottleModal(); render();
}

// ---- Weight modal ----
function openWeightModal(){
  editingWeightIdx = null;
  document.getElementById("wModalTitle").textContent = "Add weight";
  document.getElementById("wWhen").value = tsToLocal(Date.now());
  document.getElementById("wKg").value = "";
  document.getElementById("wDelBtn").style.display = "none";
  document.getElementById("wHint").textContent = "";
  document.getElementById("wModal").classList.add("on");
  updateWeightHint();
}
function openWeightEdit(idx){
  const w = weights[idx]; if(!w) return;
  editingWeightIdx = idx;
  document.getElementById("wModalTitle").textContent = "Edit weight";
  document.getElementById("wWhen").value = tsToLocal(w.t);
  document.getElementById("wKg").value = w.kg;
  document.getElementById("wDelBtn").style.display = "block";
  document.getElementById("wModal").classList.add("on");
  updateWeightHint();
}
function closeWeightModal(){document.getElementById("wModal").classList.remove("on");editingWeightIdx=null;}
function updateWeightHint(){
  const kg = parseFloat(document.getElementById("wKg").value);
  const t = localToTs(document.getElementById("wWhen").value);
  if(isNaN(kg) || isNaN(t)){ document.getElementById("wHint").textContent=""; return; }
  const prior = weights.filter((w,i)=> i!==editingWeightIdx && w.t < t).sort((a,b)=> b.t - a.t)[0];
  if(prior){
    const d = (kg - prior.kg);
    const days = (t - prior.t) / (24*3600*1000);
    const sign = d>=0?"+":"";
    document.getElementById("wHint").textContent = `${sign}${d.toFixed(2)} kg over ${days.toFixed(1)} days vs previous`;
  } else { document.getElementById("wHint").textContent = "First entry"; }
}
function weightSave(){
  const kg = parseFloat(document.getElementById("wKg").value);
  const t = localToTs(document.getElementById("wWhen").value);
  if(isNaN(kg) || kg<=0){ alert("Enter a valid weight in kg"); return; }
  if(isNaN(t)){ alert("Invalid date/time"); return; }
  const entry = {t, kg};
  if(editingWeightIdx===null) weights.push(entry); else weights[editingWeightIdx] = entry;
  sortWeights(); save(); closeWeightModal(); renderWeight();
}
function weightDelete(){
  if(editingWeightIdx===null) return;
  if(!confirm("Delete this weight entry?")) return;
  weights.splice(editingWeightIdx,1);
  save(); closeWeightModal(); renderWeight();
}

document.addEventListener("change", e=>{
  if(e.target.id==="mType") syncTypeUI();
  if(e.target.id==="mStart" || e.target.id==="mEnd") updateDurHint();
  if(e.target.id==="wWhen" || e.target.id==="wKg") updateWeightHint();
});
document.addEventListener("input", e=>{ if(e.target.id==="wKg") updateWeightHint(); });
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
document.getElementById("bModal").addEventListener("click", e=>{ if(e.target.id==="bModal") closeBottleModal(); });
document.getElementById("wModal").addEventListener("click", e=>{ if(e.target.id==="wModal") closeWeightModal(); });

// ---- Activity render ----
function renderTimers(){
  document.getElementById("timers").innerHTML = TIMED.map(t=>{
    const on = starts[t.id];
    const cls = on ? "active" : t.cls;
    const main = on ? `Stop ${t.label}` : `Start ${t.label}`;
    const sub = on ? `<br><span style="font-weight:400;font-size:13px">${dur(on,Date.now())}</span>` : "";
    return `<button class="timer-btn ${cls}${t.full?' full':''}" onclick="toggleTimer('${t.id}')">${main}${sub}</button>`;
  }).join("");
}
function renderEvents(){
  document.getElementById("events").innerHTML = EVENTS.map((e,i)=>
    `<button class="event-btn ${e.cls}" onclick='handleEventTap(${JSON.stringify(e).replace(/'/g,"&#39;")})'>${e.label}</button>`
  ).join("");
}
function renderLegend(){
  document.getElementById("legend").innerHTML = ALL_ROWS.map(r=>
    `<span><i class="swatch" style="background:${r.color}"></i>${r.label.replace(/^[^\w]+/,'')}</span>`
  ).join("");
}
function windowRange(){
  if(view==="day") return [anchor, addDays(anchor,1)];
  if(view==="week") return [anchor, addDays(anchor,7)];
  return [anchor, addMonths(anchor,1)];
}
function isCurrentWindow(){
  const [s] = windowRange();
  if(view==="day") return s === startOfDay(Date.now());
  if(view==="week") return s === startOfWeek(Date.now());
  return s === startOfMonth(Date.now());
}
function entriesInWindow(){
  const [s,e] = windowRange();
  return log.map((x,i)=>({s:x,i})).filter(({s:x})=> x.end >= s && x.start < e);
}
function durationOnDay(entry, dayStart){
  const dayEnd = addDays(dayStart, 1);
  const a = Math.max(entry.start, dayStart);
  const b = Math.min(entry.end, dayEnd);
  return Math.max(0, b-a);
}

function renderChart(){
  const svg = document.getElementById("chart");
  if(view==="day") return renderDayChart(svg);
  if(view==="week") return renderRangeChart(svg, 7);
  renderRangeChart(svg, daysInMonth(anchor));
}

function renderDayChart(svg){
  const W=700, padL=40, padR=10, padT=10, padB=30;
  const innerW = W-padL-padR;
  const rowH = 28;
  const rows = ALL_ROWS;
  const totalH = padT + rows.length*rowH + padB;
  svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);
  const dayStart = anchor;
  const dayEnd = addDays(dayStart,1);
  const xOf = t => padL + ((Math.max(dayStart,Math.min(dayEnd,t)) - dayStart)/(24*3600*1000))*innerW;
  let html = "";
  for(let h=0; h<=24; h+=3){
    const x = padL + (h/24)*innerW;
    html += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${totalH-padB}" stroke="#e5e7eb"/>`;
    html += `<text x="${x}" y="${totalH-padB+14}" font-size="10" text-anchor="middle" fill="#666">${String(h).padStart(2,'0')}</text>`;
  }
  rows.forEach((r,i)=>{
    const y = padT + i*rowH + rowH/2;
    html += `<text x="${padL-4}" y="${y+3}" font-size="10" text-anchor="end" fill="#666">${r.label.replace(/^[^\w]+/,'').trim()}</text>`;
  });
  log.forEach(s=>{
    if(s.end < dayStart || s.start > dayEnd) return;
    const rowIdx = rows.findIndex(r=>r.id===s.activity);
    if(rowIdx<0) return;
    const y = padT + rowIdx*rowH + 4;
    const h = rowH - 8;
    const x1 = xOf(s.start), x2 = xOf(s.end);
    if(s.type==="duration"){
      html += `<rect x="${x1}" y="${y}" width="${Math.max(2,x2-x1)}" height="${h}" rx="3" fill="${COLOR[s.activity]}"/>`;
    } else if(s.type==="bottle"){
      // diamond marker with mL label
      const cx = x1, cy = y+h/2, sz=6;
      html += `<polygon points="${cx},${cy-sz} ${cx+sz},${cy} ${cx},${cy+sz} ${cx-sz},${cy}" fill="${COLOR[s.activity]}"/>`;
      html += `<text x="${cx+sz+2}" y="${cy+3}" font-size="9" fill="#444">${s.ml}mL</text>`;
    } else {
      html += `<circle cx="${x1}" cy="${y+h/2}" r="5" fill="${COLOR[s.activity]}"/>`;
    }
  });
  if(isCurrentWindow()){
    Object.entries(starts).forEach(([id,t])=>{
      const rowIdx = rows.findIndex(r=>r.id===id);
      if(rowIdx<0) return;
      const y = padT + rowIdx*rowH + 4;
      const h = rowH - 8;
      const x1 = xOf(t), x2 = xOf(Date.now());
      html += `<rect x="${x1}" y="${y}" width="${Math.max(2,x2-x1)}" height="${h}" rx="3" fill="${COLOR[id]}" opacity="0.5"/>`;
    });
    const nowX = xOf(Date.now());
    html += `<line x1="${nowX}" y1="${padT}" x2="${nowX}" y2="${totalH-padB}" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>`;
  }
  svg.innerHTML = html;
}

function renderRangeChart(svg, nDays){
  const W=700, padL=40, padR=10, padT=10, padB=44;
  const innerW = W-padL-padR;
  const barArea = 130;
  const eventArea = 36;
  const mlArea = 36;
  const totalH = padT + barArea + eventArea + mlArea + padB;
  svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);
  const days = [];
  for(let i=0;i<nDays;i++){
    const dStart = addDays(anchor, i);
    const bucket = {date:dStart, BreastL:0, BreastR:0, Nap:0, Poo:0, Wee:0, BottleEBM:0, BottleFormula:0};
    log.forEach(s=>{
      if(s.type==="duration") bucket[s.activity] = (bucket[s.activity]||0) + durationOnDay(s, dStart);
      else if(s.type==="bottle"){
        if(s.start >= dStart && s.start < addDays(dStart,1)) bucket[s.activity] = (bucket[s.activity]||0) + (s.ml||0);
      } else if(s.start >= dStart && s.start < addDays(dStart,1)) bucket[s.activity] = (bucket[s.activity]||0) + 1;
    });
    days.push(bucket);
  }
  const maxDur = Math.max(1, ...days.map(d=> d.BreastL + d.BreastR + d.Nap));
  const maxHours = Math.max(1, Math.ceil(maxDur/3600000));
  const yOf = ms => padT + barArea - (ms/(maxHours*3600000))*barArea;
  const barW = innerW/nDays;
  const innerBarW = Math.max(4, barW*0.7);
  const barOffset = (barW - innerBarW)/2;
  let html = "";
  const step = maxHours <= 4 ? 1 : maxHours <= 12 ? 2 : 4;
  for(let h=0; h<=maxHours; h+=step){
    const y = yOf(h*3600000);
    html += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e5e7eb"/>`;
    html += `<text x="${padL-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#666">${h}h</text>`;
  }
  // ml axis baseline for bottle row
  const mlBase = padT + barArea + eventArea + mlArea;
  const maxMl = Math.max(1, ...days.map(d=> d.BottleEBM + d.BottleFormula));
  days.forEach((d,i)=>{
    const x = padL + i*barW + barOffset;
    let yCursor = padT + barArea;
    [["BreastL",COLOR.BreastL],["BreastR",COLOR.BreastR],["Nap",COLOR.Nap]].forEach(([k,c])=>{
      const h = (d[k]/(maxHours*3600000))*barArea;
      if(h>0){ yCursor -= h; html += `<rect x="${x}" y="${yCursor}" width="${innerBarW}" height="${h}" fill="${c}"/>`; }
    });
    const xc = padL + i*barW + barW/2;
    const lbl = view==="week" ? new Date(d.date).toLocaleDateString([], {weekday:"short"}) : String(new Date(d.date).getDate());
    if(view==="week" || i%Math.ceil(nDays/15)===0) html += `<text x="${xc}" y="${padT+barArea+12}" font-size="9" text-anchor="middle" fill="#666">${lbl}</text>`;
    const evY = padT + barArea + 22;
    if(d.Poo) html += `<circle cx="${xc-5}" cy="${evY}" r="3.5" fill="${COLOR.Poo}"/><text x="${xc-5}" y="${evY+11}" font-size="8" text-anchor="middle" fill="#666">${d.Poo}</text>`;
    if(d.Wee) html += `<circle cx="${xc+5}" cy="${evY}" r="3.5" fill="${COLOR.Wee}"/><text x="${xc+5}" y="${evY+11}" font-size="8" text-anchor="middle" fill="#666">${d.Wee}</text>`;
    // stacked bottle bar (EBM bottom, Formula top)
    let mlCursor = mlBase;
    [["BottleEBM",COLOR.BottleEBM],["BottleFormula",COLOR.BottleFormula]].forEach(([k,c])=>{
      const h = (d[k]/maxMl)*mlArea;
      if(h>0){ mlCursor -= h; html += `<rect x="${x}" y="${mlCursor}" width="${innerBarW}" height="${h}" fill="${c}"/>`; }
    });
    const totalMl = d.BottleEBM + d.BottleFormula;
    if(totalMl>0) html += `<text x="${xc}" y="${mlBase+10}" font-size="8" text-anchor="middle" fill="#666">${totalMl}</text>`;
  });
  html += `<text x="${padL}" y="${totalH-4}" font-size="9" fill="#666">Top bars: feed (L+R) & nap hours · Dots: poo/wee · Bottom bars: bottle mL/day</text>`;
  svg.innerHTML = html;
}

function renderLog(){
  let heading;
  if(view==="day") heading = isCurrentWindow() ? "Today's log" : `Log — ${fmtDate(anchor)}`;
  else if(view==="week"){ const [s,e]=windowRange(); heading = `Log — ${fmtDateShort(s)} to ${fmtDateShort(e-1)}`; }
  else heading = `Log — ${fmtMonth(anchor)}`;
  document.getElementById("logHeading").textContent = heading;
  const rows = entriesInWindow().reverse();
  document.getElementById("log").innerHTML = rows.length ? rows.map(({s,i})=>{
    const showDate = view !== "day";
    let when;
    if(s.type==="duration"){
      when = showDate? `${fmtDateShort(s.start)} ${fmtTime(s.start)} → ${fmtTime(s.end)} (${dur(s.start,s.end)})` : `${fmtTime(s.start)} → ${fmtTime(s.end)} (${dur(s.start,s.end)})`;
    } else if(s.type==="bottle"){
      const base = showDate? `${fmtDateShort(s.start)} ${fmtTime(s.start)}` : fmtTime(s.start);
      when = `${base} · ${s.ml} mL`;
    } else {
      when = showDate? `${fmtDateShort(s.start)} ${fmtTime(s.start)}` : fmtTime(s.start);
    }
    const label = s.activity;
    return `<div class="row">
      <div class="row-info"><div class="act" style="color:${COLOR[s.activity]}">${label}</div><div class="t">${when}</div></div>
      <button class="icon-btn" onclick="openEditModal(${i})" aria-label="Edit">✎</button>
    </div>`;
  }).join("") : '<div class="t">No entries</div>';
}

function renderNav(){
  let label;
  if(view==="day") label = isCurrentWindow() ? `Today · ${fmtDate(anchor)}` : fmtDate(anchor);
  else if(view==="week"){ const [s,e]=windowRange(); label = `${fmtDateShort(s)} – ${fmtDateShort(e-1)}`; }
  else label = fmtMonth(anchor);
  document.getElementById("dateLabel").textContent = label;
  document.getElementById("nextBtn").disabled = isCurrentWindow();
}

function renderSummary(){
  const entries = entriesInWindow().map(x=>x.s);
  const totals = {};
  const mlTotals = {};
  const [winS, winE] = windowRange();
  entries.forEach(s=>{
    if(s.type==="duration"){
      const a = Math.max(s.start, winS), b = Math.min(s.end, winE);
      totals[s.activity] = (totals[s.activity]||0) + Math.max(0,b-a);
    } else if(s.type==="bottle"){
      totals[s.activity] = (totals[s.activity]||0) + 1;
      mlTotals[s.activity] = (mlTotals[s.activity]||0) + (s.ml||0);
    } else {
      totals[s.activity] = (totals[s.activity]||0) + 1;
    }
  });
  const parts = [];
  TIMED.forEach(t=>{ if(totals[t.id]) parts.push(`${t.label}: ${durShort(totals[t.id])}`); });
  EVENTS.forEach(e=>{
    if(!totals[e.id]) return;
    const name = e.label.replace(/[^\w ]/g,'').trim();
    if(e.mode==="bottle") parts.push(`${name}: ${totals[e.id]}× / ${mlTotals[e.id]||0} mL`);
    else parts.push(`${name}: ${totals[e.id]}`);
  });
  if(view !== "day" && parts.length){
    const days = view==="week" ? 7 : daysInMonth(anchor);
    const elapsedDays = isCurrentWindow() ? Math.min(days, Math.ceil((Date.now()-winS)/(24*3600*1000))) : days;
    const avgParts = [];
    TIMED.forEach(t=>{ if(totals[t.id]) avgParts.push(`${t.label.split(' ').pop()[0]}:${durShort(totals[t.id]/elapsedDays)}`); });
    EVENTS.forEach(e=>{
      if(!totals[e.id]) return;
      const nm = e.label.replace(/[^\w ]/g,'').trim();
      if(e.mode==="bottle") avgParts.push(`${nm[0]}:${Math.round((mlTotals[e.id]||0)/elapsedDays)}mL`);
      else avgParts.push(`${nm[0]}:${(totals[e.id]/elapsedDays).toFixed(1)}`);
    });
    document.getElementById("summary").innerHTML = parts.join(" · ") + `<br><span style="color:#999">Avg/day: ${avgParts.join(' · ')}</span>`;
    return;
  }
  document.getElementById("summary").textContent = parts.join(" · ") || "No activity";
}

function render(){ renderTimers(); renderEvents(); renderLegend(); renderNav(); renderChart(); renderSummary(); renderLog(); }

// ---- Weight render (unchanged) ----
function renderWeight(){ renderWeightChart(); renderWeightStats(); renderWeightLog(); }
function renderWeightChart(){
  const svg = document.getElementById("wChart");
  const W=700, padL=44, padR=14, padT=14, padB=34;
  const H=240;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if(weights.length < 1){ svg.innerHTML = `<text x="${W/2}" y="${H/2}" font-size="12" text-anchor="middle" fill="#999">No weight entries yet</text>`; return; }
  const ws = weights.slice().sort((a,b)=> a.t - b.t);
  const tMin = ws[0].t;
  const tMax = ws[ws.length-1].t === tMin ? tMin + 24*3600*1000 : ws[ws.length-1].t;
  const kgs = ws.map(w=>w.kg);
  let kMin = Math.min(...kgs), kMax = Math.max(...kgs);
  if(kMin === kMax){ kMin -= 0.5; kMax += 0.5; }
  const pad = (kMax-kMin)*0.1;
  kMin -= pad; kMax += pad;
  const xOf = t => padL + ((t - tMin)/(tMax - tMin))*(W - padL - padR);
  const yOf = k => padT + (1 - (k - kMin)/(kMax - kMin))*(H - padT - padB);
  let html = "";
  const yTicks = 4;
  for(let i=0;i<=yTicks;i++){
    const k = kMin + (kMax-kMin)*i/yTicks;
    const y = yOf(k);
    html += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e5e7eb"/>`;
    html += `<text x="${padL-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#666">${k.toFixed(2)}</text>`;
  }
  [tMin, (tMin+tMax)/2, tMax].forEach(t=>{
    const x = xOf(t);
    html += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}" stroke="#f3f4f6"/>`;
    html += `<text x="${x}" y="${H-padB+14}" font-size="9" text-anchor="middle" fill="#666">${fmtDateShort(t)}</text>`;
  });
  if(ws.length > 1){
    const path = ws.map((w,i)=> `${i===0?'M':'L'}${xOf(w.t).toFixed(1)},${yOf(w.kg).toFixed(1)}`).join(" ");
    html += `<path d="${path}" fill="none" stroke="#2563eb" stroke-width="2"/>`;
  }
  ws.forEach(w=>{ html += `<circle cx="${xOf(w.t)}" cy="${yOf(w.kg)}" r="4" fill="#2563eb" stroke="white" stroke-width="1.5"/>`; });
  html += `<text x="${padL}" y="${H-4}" font-size="9" fill="#666">Weight (kg) over time</text>`;
  svg.innerHTML = html;
}
function renderWeightStats(){
  const el = document.getElementById("wStats");
  if(!weights.length){ el.innerHTML = '<div class="t">Add a weight entry to see stats</div>'; return; }
  const ws = weights.slice().sort((a,b)=> a.t - b.t);
  const first = ws[0], last = ws[ws.length-1];
  const totalDays = (last.t - first.t)/(24*3600*1000);
  const totalGain = last.kg - first.kg;
  const avgPerDay = totalDays > 0 ? (totalGain/totalDays) : 0;
  const avgPerWeek = avgPerDay * 7;
  const sevenAgo = last.t - 7*24*3600*1000;
  const recent = ws.filter(w=> w.t >= sevenAgo);
  let recentRate = "—";
  if(recent.length >= 2){
    const a = recent[0], b = recent[recent.length-1];
    const days = (b.t - a.t)/(24*3600*1000);
    if(days > 0) recentRate = `${((b.kg - a.kg)/days*7).toFixed(2)} kg/wk`;
  }
  el.innerHTML = `
    <div class="stat-row"><span>Latest</span><span class="v">${last.kg.toFixed(2)} kg · ${fmtDateShort(last.t)}</span></div>
    <div class="stat-row"><span>Total change</span><span class="v">${totalGain>=0?'+':''}${totalGain.toFixed(2)} kg over ${totalDays.toFixed(1)} d</span></div>
    <div class="stat-row"><span>Avg gain</span><span class="v">${(avgPerWeek>=0?'+':'')}${avgPerWeek.toFixed(2)} kg/wk</span></div>
    <div class="stat-row"><span>Last 7 days</span><span class="v">${recentRate}</span></div>
  `;
}
function renderWeightLog(){
  const el = document.getElementById("wLog");
  if(!weights.length){ el.innerHTML = '<div class="t">No entries</div>'; return; }
  const ws = weights.map((w,i)=>({w,i})).sort((a,b)=> b.w.t - a.w.t);
  el.innerHTML = ws.map(({w,i})=>{
    const sortedAsc = weights.slice().sort((a,b)=> a.t - b.t);
    const pos = sortedAsc.findIndex(x=> x.t===w.t && x.kg===w.kg);
    const prev = pos > 0 ? sortedAsc[pos-1] : null;
    let delta = "";
    if(prev){
      const d = w.kg - prev.kg;
      const sign = d>=0?"+":"";
      delta = `<span style="color:${d>=0?'#10b981':'#dc2626'}">${sign}${d.toFixed(2)} kg</span>`;
    }
    return `<div class="row">
      <div class="row-info">
        <div class="act">${w.kg.toFixed(2)} kg ${delta}</div>
        <div class="t">${fmtDate(w.t)} ${fmtTime(w.t)}</div>
      </div>
      <button class="icon-btn" onclick="openWeightEdit(${i})" aria-label="Edit">✎</button>
    </div>`;
  }).join("");
}

// ---- Export / Import CSV ----
function exportCSV(){
  let csv = "kind,activity,type,start_iso,end_iso,duration_sec,ml,kg\n";
  log.forEach(s=>{
    const ml = s.ml ?? "";
    csv += `activity,${s.activity},${s.type},${new Date(s.start).toISOString()},${new Date(s.end).toISOString()},${Math.floor((s.end-s.start)/1000)},${ml},\n`;
  });
  weights.forEach(w=>{
    csv += `weight,,,${new Date(w.t).toISOString()},,,,${w.kg}\n`;
  });
  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `babylog_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

function importCSV(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length < 2) throw new Error("Empty file");
      const header = lines[0].toLowerCase().split(",").map(s=>s.trim());
      const hasKind = header.includes("kind");
      const col = name => header.indexOf(name);
      const iKind = col("kind"), iAct = col("activity"), iType = col("type"),
            iStart = col("start_iso"), iEnd = col("end_iso"),
            iMl = col("ml"), iKg = col("kg");
      const impActs = [], impWts = [];
      for(let i=1; i<lines.length; i++){
        const cols = lines[i].split(",").map(s=>s.trim());
        const kind = hasKind ? cols[iKind] : "activity";
        if(kind === "activity"){
          const activity = cols[iAct];
          const type = cols[iType];
          const start = new Date(cols[iStart]).getTime();
          const end = new Date(cols[iEnd] || cols[iStart]).getTime();
          if(!VALID_IDS.has(activity)) continue;
          if(!["duration","event","bottle"].includes(type)) continue;
          if(isNaN(start) || isNaN(end)) continue;
          const entry = {activity, type, start, end};
          if(type==="bottle"){
            const ml = iMl>=0 ? parseFloat(cols[iMl]) : NaN;
            if(isNaN(ml) || ml<=0) continue;
            entry.ml = ml;
          }
          impActs.push(entry);
        } else if(kind === "weight"){
          const t = new Date(cols[iStart]).getTime();
          const kg = parseFloat(cols[iKg]);
          if(isNaN(t) || isNaN(kg) || kg<=0) continue;
          impWts.push({t, kg});
        }
      }
      if(!impActs.length && !impWts.length) throw new Error("No valid rows found");
      const msg = `Import ${impActs.length} activity + ${impWts.length} weight entries.\n\nOK = MERGE with existing (skips duplicates)\nCancel = REPLACE all existing data`;
      const choice = confirm(msg);
      if(choice){
        const exA = new Set(log.map(s=>`${s.activity}|${s.start}|${s.end}|${s.ml||''}`));
        const exW = new Set(weights.map(w=>`${w.t}|${w.kg}`));
        let aN=0, wN=0;
        impActs.forEach(s=>{ const k=`${s.activity}|${s.start}|${s.end}|${s.ml||''}`; if(!exA.has(k)){ log.push(s); exA.add(k); aN++; } });
        impWts.forEach(w=>{ const k=`${w.t}|${w.kg}`; if(!exW.has(k)){ weights.push(w); exW.add(k); wN++; } });
        alert(`Merged: ${aN} activity, ${wN} weight entries added.`);
      } else {
        if(!confirm("Really REPLACE all current data?")) return;
        log = impActs; weights = impWts;
        alert(`Replaced: ${impActs.length} activity, ${impWts.length} weight entries.`);
      }
      sortLog(); sortWeights(); save();
      render(); renderWeight();
    } catch(err){
      alert("Import failed: " + err.message);
    }
    ev.target.value = "";
  };
  reader.readAsText(file);
}

render();
setInterval(()=>{ if(Object.keys(starts).length){ renderTimers(); if(view==="day") renderChart(); } }, 1000);
</script>
